plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xinghui.tv'
    // Compose 已移除：它是空挂载（0 个 @Composable、0 处 androidx.compose 引用、0 个 ComposeView），
    // 曾经只挂在 build.gradle 里（插件 + BOM + ui + material3 + tv-material）从未产出界面。
    //
    // compileSdk 必须是 36，不是 37：
    //   sdkmanager 的 platform 包最高只到 android-36（37 尚未发布，只有 android-canary-*）。
    //   而 core-ktx 1.19.1 的 aar-metadata 硬性要求 minCompileSdk=37，两者不可同时满足，
    //   所以 core-ktx 固定 1.18.0（它要求 minCompileSdk=36）。
    //   等 platform 37 正式发布后，再把 core-ktx 与 compileSdk 一起升。
    compileSdk 36

    defaultConfig {
        applicationId "com.xinghui.tv"
        minSdk 23   // 由 core-ktx 1.18.0 决定：它的 AndroidManifest 写 minSdkVersion=23。
                    // recyclerview 1.4.0 只要 21，media3/appcompat/profileinstaller 更低，都不是约束项。
                    // 与 Compose 无关。
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
        // 只保留 cargo-ndk 编译出的 ABI
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 预编译 .so 由脚本（scripts/build-android.sh / CI）放置到 src/main/jniLibs
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Kotlin 2.x：用 compilerOptions 代替已废弃的 kotlinOptions
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

dependencies {
    // Baseline Profile：低端设备靠它在安装时 AOT 关键路径
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    // org.json / logger 已移除：前者 Android framework 内置（外部 jar 会被 BootClassLoader 抢先，永远用不上），
    // 后者 2017 停维护且全项目仅 2 处调用，改用 android.util.Log。
    implementation 'androidx.core:core-ktx:1.18.0'   // 1.19.x 要求 compileSdk 37，见上
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // ★UI 基础：列表与网格一律 RecyclerView（androidx.recyclerview 1.4.0）。
    //   原版的线路行/集数网格用的是 leanback 的 HorizontalGridView / VerticalGridView，
    //   那套 API 在 1.1.0（2023）之后基本停更；而它的网格本质就是
    //   RecyclerView + 特定 LayoutManager + 焦点记忆 —— 效果等价，不引入这个依赖。
    //   焦点态由 selector_*.xml 提供（与原版同一套 drawable），观感一致。
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    // 流媒体扩展：DefaultMediaSourceFactory 靠反射查找这三个工厂类。
    // 缺任何一个，遇到 .m3u8 / .mpd / .ism 就抛
    // IllegalStateException: No suitable media source factory found for content type: N
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.11.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // 推送二维码（对齐原版 utils/QRCode.java 的 zxing 用法）
    implementation 'com.google.zxing:core:3.5.3'
    // catvod 基础类（spider.jar 运行时依赖这些类，由 app 侧提供，与原版一致）
    implementation 'com.google.code.gson:gson:2.10.1'
}
