plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xinghui.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.xinghui.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        // 只保留 cargo-ndk 编译出的 ABI
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 预编译 .so 由脚本（scripts/build-android.sh / CI）放置到 src/main/jniLibs
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    // 流媒体扩展：DefaultMediaSourceFactory 靠反射查找这三个工厂类。
    // 缺任何一个，遇到 .m3u8 / .mpd / .ism 就抛
    // IllegalStateException: No suitable media source factory found for content type: N
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.3.1'
    implementation 'org.json:json:20240303'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // 推送二维码（对齐原版 utils/QRCode.java 的 zxing 用法）
    implementation 'com.google.zxing:core:3.5.3'
    // catvod 基础类（spider.jar 运行时依赖这些类，由 app 侧提供，与原版一致）
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.orhanobut:logger:2.2.0'
}
