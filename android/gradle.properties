org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- AGP 9.x 兼容开关 ----
# AGP 9.0 起内置 Kotlin，且 android DSL 换成新接口；
# 我们仍用 org.jetbrains.kotlin.android 2.4.21 + Compose 编译器插件，
# 因此需要显式 opt-out 这两项，否则会报
# "org.jetbrains.kotlin.android plugin is not compatible with the new DSL"。
# 注：AGP 9.6 起 newDsl=false 会被移除，届时必须迁移到内置 Kotlin。
android.builtInKotlin=false
android.newDsl=false
