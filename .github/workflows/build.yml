name: 星汇 TV Android 编译

# 用途：编译 arm64-v8a 的 Debug APK。真机是斐讯 T1（API 25），只认 arm64。
# 触发：仅手动 workflow_dispatch，不随 push 自动跑。
#
# 三条硬约束：
#   1. Rust 引擎必须带 --features jni。缺这个参数时 jni 桥（#[cfg(feature="jni")]）
#      不进 .so，libtv_engine.so 没有 Java_com_xinghui_tv_Engine_execute 符号，
#      运行时必然 UnsatisfiedLinkError。
#   2. Gradle 必须 9.9.1。AGP 9.5.1 的 Gradle 下限是 9.6.0；AGP 8.x 在 Gradle 9.6+
#      不可用（它依赖的 InternalProblems 内部 API 在 9.6.0 被移除）。
#   3. 不启用缓存。全量构建几分钟，缓存的命中收益低于它带来的维护成本。

on:
  workflow_dispatch:

env:
  RUST_VERSION: stable
  JAVA_VERSION: 17
  # 36 是 sdkmanager 当前发布的最高 platform（37 只有 canary，不可用于稳定构建）
  ANDROID_COMPILE_SDK: 36
  # build-tools 独立于 compileSdk 选版本：它只负责 aapt2、zipalign、apksigner。
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:
  build-debug-apk:
    name: 编译 Debug 安装包 (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # 只装三项。
      # NDK 是给 cargo-ndk 交叉编译 Rust 引擎用的；Android 侧没有 externalNativeBuild。
      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked

      # 产物落到 android/app/src/main/jniLibs/arm64-v8a/libtv_engine.so，
      # 该目录已由 app/build.gradle 的 sourceSets.main.jniLibs 声明，无需再拷贝。
      - name: 编译 Rust 引擎 (arm64-v8a)
        working-directory: engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}/sysroot"
        run: cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release --features jni

      # 工程只有 gradle-wrapper.properties、没有 gradlew 脚本，所以在这里装固定版本。
      # cache: false —— 见文件头第 3 条。
      - name: 安装 Gradle 9.9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
          cache: false

      # --no-daemon：CI 是一次性构建，守护进程只会白占内存。
      - name: 编译 Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 星汇TV-debug-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
