name: 星汇 TV Android 编译

on:
  workflow_dispatch:

env:
  RUST_VERSION: stable
  JAVA_VERSION: 17
  ANDROID_COMPILE_SDK: 36
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_NDK_VERSION: 26.1.10909125

jobs:
  build-debug-apk:
    name: 编译 Debug 安装包 (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 安装安卓 SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk

      # 构建前端页面
      - name: 构建前端页面
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 前端资源拷贝到安卓安装包
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -r frontend/dist/* android/app/src/main/assets/web/

      # ============ 编译 Rust 引擎必须带 --features jni ============
      # 缺少该参数时 jni 桥（#[cfg(feature="jni")]）不编译进 .so，
      # libtv_engine.so 就没有导出 Java_com_xinghui_tv_Engine_execute 符号，
      # 运行时 UnsatisfiedLinkError。
      # NDK 仍需安装：android/app/build.gradle 里已删掉 ndkVersion / externalNativeBuild
      #（自研 render 的 cpp/ 已清），但 cargo-ndk 编译 Rust 引擎要用这份 NDK。
      - name: 编译 Rust 引擎 (arm64)
        working-directory: engine
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          BINDGEN_EXTRA_CLANG_ARGS: "--sysroot=${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}/sysroot"
        run: cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release --features jni

      # ★Gradle 必须钉 9.9.1：
      #   本轮工具链已升到 AGP 8.13.2 / Kotlin 2.4.21 / compileSdk 36。
      #   AGP 8.13.2 要求 Gradle >= 8.13，用 8.7 会在配置阶段直接报
      #   "Incompatible Gradle version"。
      #   本工程的 wrapper 只留了 gradle-wrapper.properties（没有 gradlew 脚本），
      #   所以这里用 setup-gradle 装 9.9.1，顺带把依赖缓存也带上。
      - name: 安装 Gradle 9.9.1（对齐 AGP 8.13.2）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: 编译 Debug 安装包
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 星汇TV-debug-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
